---
name: test
on: pull_request
permissions: {}
concurrency:
  group: ${{ github.workflow }}--${{ github.ref }}
  cancel-in-progress: true
jobs:
  status-check:
    runs-on: ubuntu-24.04
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 10
    permissions: {}
    needs:
      - integration
      - quality
    steps:
      - run: exit 1
  integration:
    uses: ./.github/workflows/workflow_call_integration_test.yaml
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
    permissions:
      contents: read
      id-token: write

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          install_args: go hk golangci-lint aqua:suzuki-shunsuke/langcheck aqua:suzuki-shunsuke/nllint typos go:github.com/google/go-licenses/v2 goreleaser
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{runner.os}}-${{runner.arch}}-${{hashFiles('go.sum')}}
          restore-keys: go-${{runner.os}}-${{runner.arch}}-
      - uses: flatt-security/setup-takumi-guard-golang@2e3c7c40b538cd68b2ac483def12982ebc8bc02e # v1
        with:
          bot-id: ${{secrets.TAKUMI_GUARD_BOT_ID}}
      - name: Check repository
        run: hk check --all
      - name: Check dependency licenses
        run: go-licenses check --disallowed_types=forbidden,restricted,unknown ./...
      - name: Validate release configuration
        run: goreleaser check
      - name: Check generated files
        run: |
          go run ./cmd/gen-jsonschema
          bash scripts/generate-usage.sh
          git diff --exit-code -- json-schema/ghtkn.json USAGE.md

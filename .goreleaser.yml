---
version: 2
project_name: ghtkn
archives:
  - name_template: "{{.ProjectName}}_{{.Os}}_{{.Arch}}"
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"
  extra_files:
    - glob: LICENSE
builds:
  - binary: ghtkn
    main: cmd/ghtkn/main.go
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
release:
  github:
    owner: dkarter
    name: ghtkn
  prerelease: auto
  header: |
    [Pull Requests](https://github.com/dkarter/ghtkn/pulls?q=is%3Apr+milestone%3A{{.Tag}}) | [Issues](https://github.com/dkarter/ghtkn/issues?q=is%3Aissue+milestone%3A{{.Tag}}) | https://github.com/dkarter/ghtkn/compare/{{.PreviousTag}}...{{.Tag}}

sboms:
  - id: default
    disable: false
